import com.vladsch.flexmark.ext.tables.TablesExtension
import com.vladsch.flexmark.html.HtmlRenderer
import com.vladsch.flexmark.parser.Parser
import com.vladsch.flexmark.util.data.MutableDataSet

import java.text.SimpleDateFormat

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // renders src/markdown/*.md into the HTML shown by the in-app viewers
        classpath 'com.vladsch.flexmark:flexmark:0.64.8'
        classpath 'com.vladsch.flexmark:flexmark-ext-tables:0.64.8'
    }
}

plugins {
    id 'java'
    id 'jacoco'
    id 'com.github.ben-manes.versions' version '0.66.0'
}

java {
    // Gradle itself may run on any supported JDK (17-27); compilation uses a JDK 8 toolchain so the jar runs on JRE 8
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    version = '0.8.3.4'
}

repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
    maven { url 'https://plugins.gradle.org/m2/' }
    maven { url 'https://repo.spring.io/release' }
    maven { url 'https://jaspersoft.jfrog.io/jaspersoft/third-party-ce-artifacts/' }
}

dependencies {
    // https://mvnrepository.com/artifact/org.postgresql/postgresql
    implementation 'org.postgresql:postgresql:42.7.14'

    // https://mvnrepository.com/artifact/net.sf.jasperreports/jasperreports
    implementation 'net.sf.jasperreports:jasperreports:6.21.5'

    // google roboto font (https://github.com/google/roboto/releases) package for jasper reports
    // howto: https://community.jaspersoft.com/wiki/custom-font-font-extension
    implementation files('libs/google-roboto-2.138.jar')

    // https://mvnrepository.com/artifact/org.swinglabs.swingx/swingx-all
    implementation 'org.swinglabs.swingx:swingx-all:1.6.5-1'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation 'org.apache.commons:commons-lang3:3.21.0'

    // https://mvnrepository.com/artifact/com.github.jiconfont/jiconfont-swing
    implementation 'com.github.jiconfont:jiconfont-swing:1.0.1'

    // https://mvnrepository.com/artifact/com.github.jiconfont/jiconfont-font_awesome
    implementation 'com.github.jiconfont:jiconfont-font_awesome:4.7.0.1'

    // https://mvnrepository.com/artifact/org.hibernate/hibernate-core
    implementation 'org.hibernate:hibernate-core:5.6.15.Final'

    // https://mvnrepository.com/artifact/org.hibernate/hibernate-c3p0
    implementation 'org.hibernate:hibernate-c3p0:5.6.15.Final'

    // https://mvnrepository.com/artifact/com.mchange/c3p0
    // 0.10.x proxies reference JDBC 4.3 (Java 9+) types such as java.sql.ShardingKey and fail on JRE 8
    implementation 'com.mchange:c3p0:0.9.5.5'

    // https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-core
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'

    // https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-api
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'

    // https://mvnrepository.com/artifact/com.github.lgooddatepicker/LGoodDatePicker
    implementation 'com.github.lgooddatepicker:LGoodDatePicker:11.2.1'

    // https://mvnrepository.com/artifact/org.apache.poi/poi
    implementation 'org.apache.poi:poi:5.5.1'

    // https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
    implementation 'javax.xml.bind:jaxb-api:2.3.1'

    // https://mvnrepository.com/artifact/javax.annotation/javax.annotation-api
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // https://mvnrepository.com/artifact/org.projectlombok/lombok
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    // https://mvnrepository.com/artifact/org.hibernate/hibernate-jpamodelgen
    compileOnly 'org.hibernate:hibernate-jpamodelgen:5.6.15.Final'
    annotationProcessor group: 'org.hibernate', name: 'hibernate-jpamodelgen', version: '5.6.15.Final'

    // tests run on the JDK 8 toolchain: JUnit 6 needs Java 17, Mockito 5 needs Java 11
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 no longer provides the launcher implicitly
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.6'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    // inline mock maker, needed for mockStatic
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.11.0'
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    finalizedBy jacocoTestReport
}

// XML is consumed by the coverage step in .github/workflows/ci.yml
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

jar {
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.MF'
    manifest {
        attributes 'SplashScreen-Image': 'splash.png',
                'Implementation-Title': 'ProMaSy',
                'Implementation-Version': archiveVersion,
                'Main-Class': 'com.github.andriilab.promasy.App',
                'Class-Path': configurations.runtimeClasspath.files.collect { "lib/$it.name" }.join(' ')
    }

    doFirst {
        copy {
            from configurations.runtimeClasspath
            into layout.buildDirectory.dir('libs/lib')
        }
    }

    doLast {
        copy {
            from 'reports'
            include '*.jrxml'
            into layout.buildDirectory.dir('libs/reports')
        }
    }
}

tasks.register('createVersionProperties') {
    dependsOn processResources
    doFirst {
        SimpleDateFormat format = new SimpleDateFormat('yyyy-MM-dd HH:mm:ss')
        new File('src/main/resources/PromasyVersion.properties').withWriter { w ->
            Properties p = new Properties()
            p.setProperty('versionNumber', project.version.toString())
            p.setProperty('buildDate', format.format(Calendar.getInstance().getTime()))
            p.store w, null
        }
        copy {
            from 'src/main/resources/PromasyVersion.properties'
            into layout.buildDirectory.dir('resources/main')
        }
    }
}

tasks.register('setConsoleCyrillicSupport') {
    dependsOn processResources
    doLast {
        Properties props = new Properties()
        File propsFile = layout.buildDirectory.file('/resources/main/log4j2.properties').get().asFile
        // with* closes the streams; leaked handles keep the daemon locking the file and break `clean`
        propsFile.withInputStream { props.load(it) }
        props.setProperty('appender.console.layout.charset', 'CP866')
        propsFile.withWriter { props.store(it, null) }
    }
}

tasks.register('writePackages') {
    dependsOn processResources
    File pkgsFile = new File('src/markdown/PACKAGES.md')
    pkgsFile.write("# Packages used in ProMaSy $project.version build\n\n")
    pkgsFile.append('|Name|Version|\n')
    pkgsFile.append('|---|---|\n')
    configurations.compileClasspath
            .collect { it.name }
            .sort(false, String.CASE_INSENSITIVE_ORDER)
            .each {
                String pkgName = it.find('^.+?(?=-\\d)')
                String pkgVersion = it.substring(pkgName.length() + 1, it.length() - 4)
                pkgsFile.append("|$pkgName|$pkgVersion|\n")
            }
}

tasks.register('convertMarkdown') {
    dependsOn processResources
    File sourceDir = file('src/markdown')
    File outputDir = file('src/main/resources')
    doLast {
        MutableDataSet options = new MutableDataSet()
        options.set(Parser.EXTENSIONS, [TablesExtension.create()])
        Parser parser = Parser.builder(options).build()
        HtmlRenderer renderer = HtmlRenderer.builder(options).build()
        sourceDir.listFiles().findAll { it.name.endsWith('.md') }.each { md ->
            File html = new File(outputDir, md.name.replaceAll(/\.md$/, '.html'))
            html.setText(renderer.render(parser.parse(md.getText('UTF-8'))), 'UTF-8')
        }
    }
}

classes {
    dependsOn writePackages
    dependsOn convertMarkdown
    dependsOn createVersionProperties
    dependsOn setConsoleCyrillicSupport
}