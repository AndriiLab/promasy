name: CD

# Manual release: run from the Actions tab on master once CI has passed for its head commit.
on:
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

# contents: write pushes the tag and creates the release; actions: read looks up the CI runs.
permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SERVER: ${{ github.server_url }}
    steps:
      # Full history and tags, for the tag check and the changelog since the previous release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 27

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2

      - name: Read version
        id: version
        run: |
          version=$(gradle -q properties --property version --no-daemon | sed -n 's/^version: //p')
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The CI run's conclusion is success only when unit tests, integration tests and CodeQL all passed.
      - name: Require successful CI for this commit
        run: |
          count=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          if [ "$count" -eq 0 ]; then
            echo "::error::No successful CI run for $GITHUB_SHA; wait for CI to pass before releasing"
            exit 1
          fi

      - name: Stop if the release already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump the version in build.gradle"
            exit 1
          fi

      - name: Build release zip
        run: gradle releaseZip --no-daemon

      - name: Push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            tagged=$(git rev-parse "$TAG^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already points to $tagged, not $GITHUB_SHA"
              exit 1
            fi
            echo "::notice::Tag $TAG already exists on this commit, skipping"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "ProMaSy $VERSION"
            git push origin "$TAG"
          fi

      # Commit subjects since the previous release tag (merges dropped), each linked to its commit.
      - name: Write release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$TAG" HEAD 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            echo '## Changes'
            echo
            git log --no-merges --reverse --format="- %s ([%h]($SERVER/$REPO/commit/%H))" "$range"
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: $SERVER/$REPO/compare/$prev...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" "build/distributions/promasy-$VERSION.bin.zip" \
            --repo "$REPO" \
            --title "ProMaSy $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
